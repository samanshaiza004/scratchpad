name: GPUI dogfood

on:
  push:
    branches: [main, gpui-dogfood]
  pull_request:

jobs:
  gate-1-through-4:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - if: runner.os == 'Windows'
        run: .\tools\gpui.ps1 test
      - if: runner.os != 'Windows'
        run: ./tools/gpui.sh test
        shell: bash
      - if: runner.os == 'Windows'
        run: .\tools\gpui.ps1 smoke
      - if: runner.os != 'Windows'
        run: ./tools/gpui.sh smoke
        shell: bash
