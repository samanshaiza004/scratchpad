name: GPUI dogfood

on:
  push:
    branches: [main, gpui-dogfood]
  pull_request:

jobs:
  gate-1-through-4:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - if: runner.os == 'Windows'
        run: .\tools\gpui.ps1 test
      - if: runner.os != 'Windows'
        run: ./tools/gpui.sh test
        shell: bash
      - name: Check Caliber boundary (Windows)
        if: runner.os == 'Windows'
        run: |
          .\tools\caliber.ps1 doctor
          .\tools\caliber.ps1 check
      - name: Check Caliber boundary (macOS and Linux)
        if: runner.os != 'Windows'
        run: |
          sh tools/caliber.sh doctor
          sh tools/caliber.sh check
        shell: bash
      - if: runner.os == 'Windows'
        run: .\tools\gpui.ps1 smoke
      - if: runner.os == 'Linux'
        run: echo "Native GPUI window smoke is unavailable on hosted Xvfb because it has no presentable surface; Windows and macOS run native smoke."
        shell: bash
      - if: runner.os == 'macOS'
        run: ./tools/gpui.sh smoke
        shell: bash
