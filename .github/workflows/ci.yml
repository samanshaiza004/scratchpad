name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build commands
        run: |
          go build ./cmd/scratchpad
          go build ./cmd/scratcheditor
          go build ./cmd/fragmentbench
          go build ./cmd/textbench
