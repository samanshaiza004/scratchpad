name: CI

on:
  push:
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build commands
        run: |
          go build ./cmd/scratchpad
          go build ./cmd/scratcheditor
          go build ./cmd/fragmentbench
          go build ./cmd/textbench
          go build -tags treesitter_cgo ./cmd/treebench
