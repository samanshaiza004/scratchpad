name: CI

on:
  push:
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -tags treesitter_release ./...
      - name: Vet
        run: go vet ./...
      - name: Build Go tools
        run: |
          go build -tags treesitter_release ./cmd/alicorn-dev
          go build -tags treesitter_release ./cmd/fragmentbench
          go build -tags treesitter_cgo ./cmd/treebench

  no-cgo-compatibility:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOOS: windows
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify the pure-Go language adapter on Linux
        run: go test -tags treesitter_pure ./language/treesitter
        env:
          GOOS: linux
      - name: Cross-build the pure-Go language adapter tool for Windows
        run: go build -tags treesitter_pure -o treesitter-pure.exe ./cmd/treebench
