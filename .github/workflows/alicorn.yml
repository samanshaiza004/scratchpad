name: Alicorn native frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Alicorn public API boundary
        run: go run ./tools/check-alicorn-boundary
      - uses: dtolnay/rust-toolchain@stable
      - uses: laytan/setup-odin@v2
        with:
          token: false
          release: nightly
      - name: Set up MSVC linker and Windows SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install 64-bit MinGW-w64 for Go cgo
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add 64-bit cgo compiler to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:MSYS2_LOCATION 'ucrt64\bin')
      - name: Install SDL3
        if: runner.os == 'macOS'
        run: brew install sdl3
      - name: Headless Go, ABI, Odin, and lifecycle checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\alicorn.ps1 test
      - name: Headless Go, ABI, Odin, and lifecycle checks
        if: runner.os == 'macOS'
        run: ./tools/alicorn.sh test
      - name: Native window lifecycle smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\alicorn.ps1 smoke
      - name: Native window lifecycle smoke
        if: runner.os == 'macOS'
        run: ./tools/alicorn.sh smoke
      - name: Build native release artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\alicorn.ps1 build --release
      - name: Build native release artifact
        if: runner.os == 'macOS'
        run: ./tools/alicorn.sh build --release
      - name: Upload Alicorn artifact
        uses: actions/upload-artifact@v4
        with:
          name: scratchpad-alicorn-${{ matrix.os }}
          path: out/alicorn/
          if-no-files-found: error

  linux-foreign-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Alicorn public API boundary
        run: go run ./tools/check-alicorn-boundary
      - uses: dtolnay/rust-toolchain@stable
      - uses: laytan/setup-odin@v2
        with:
          token: false
          release: nightly
      - name: Install SDL3 for Linux frontend integration tests
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        id: sdl
        with:
          version: 3-latest
          install-linux-dependencies: true
          add-to-environment: true
      - name: Go, Caliber ABI, Odin type, and lifecycle checks
        env:
          LIBRARY_PATH: ${{ steps.sdl.outputs.prefix }}/lib
        run: ./tools/alicorn.sh test
